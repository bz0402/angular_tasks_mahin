<div class="card shadow-sm rounded-4 h-100">
  <div class="card-body d-flex flex-column">
    <!-- Header: Title, Author, Rating, Added -->
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h3 class="text-success fw-bold mb-0">
          {{ book.title | truncateText:15 }}
        </h3>
        <p class="text-muted mb-0">
          <i class="bi bi-person-fill me-1"></i>{{ book.author }}
        </p>
      </div>
      <div class="d-flex flex-column align-items-end">
        <span *ngIf="book.added" class="badge bg-light text-muted border rounded-pill small mb-1">
          <i class="bi bi-clock-history me-1"></i>{{ book.added | timeAgo }}
        </span>
        <span class="badge text-black border rounded-pill">
          <i class="bi bi-star-fill text-success me-1"></i>{{ book.rating }} / 5
        </span>
      </div>
    </div>

    <!-- Book Details -->
    <div class="mb-3 small">
      <p class="mb-1">
        <i class="bi bi-tag me-2 text-muted"></i>
        <strong>Genre:</strong> {{ book.genre }}
      </p>
      <p class="mb-1">
        <i class="bi bi-calendar-event me-2 text-muted"></i>
        <strong>Published:</strong> {{ book.published | date: 'longDate' }}
      </p>
      <p class="mb-0">
        <i class="bi bi-circle-half me-2 text-muted"></i>
        <strong>Status:</strong>
        <span class="badge px-2 py-1 rounded-pill bg-light ms-2 small border" [ngClass]="{
            'text-success': book.status === 'Read',
            'text-danger': book.status === 'Unread'
          }">
          {{ book.status }}
        </span>
      </p>
    </div>

    <!-- Summary -->
    <div class="mt-auto">
      <p class="text-secondary small mb-0">
        <i class="bi bi-info-circle me-1"></i>{{ book.summary | truncateText:55 }}
      </p>
    </div>
  </div>
</div>
