<div class="card h-100 border rounded-4 shadow-sm overflow-hidden position-relative d-flex flex-column">

  <!-- Source Badge (Top Right) -->
  <div
    class="badge bg-white text-success border border-success position-absolute top-0 end-0 m-2 rounded-pill px-5 placeholder-glow">
    <span class="placeholder col-6"></span>
  </div>

  <!-- Article Image or Placeholder -->
  <div class="bg-secondary-subtle w-100" style="height: 220px;">
    <div class="placeholder-glow w-100 h-100"></div>
  </div>

  <div class="card-body d-flex flex-column">
    <!-- Title -->
    <h5 class="card-title fw-semibold placeholder-glow">
      <span class="placeholder placeholder-glow col-8"></span>
    </h5>

    <!-- Description -->
    <p class="card-text text-muted small mb-2 placeholder-glow">
      <span class="placeholder placeholder-glow col-12"></span>
    </p>

    <!-- Content Preview -->
    <p class="card-text text-secondary small mb-3 placeholder-glow">
      <span class="placeholder placeholder-glow col-10"></span>
    </p>

    <!-- Meta Info -->
    <div class="text-secondary small mb-3">
      <div class="mb-1">
        <span class="placeholder placeholder-glow col-4"></span>
      </div>
      <div>
        <span class="placeholder placeholder-glow col-6"></span>
      </div>
    </div>

    <!-- Read More Button -->
    <div class="btn btn-light border text-success border-2 fw-bold btn-sm mt-auto align-self-start placeholder-glow">
      <span class="placeholder placeholder-glow col-6 px-5"></span>
    </div>
  </div>
</div>
